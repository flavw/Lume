[package]
name = "lume"
version = "0.25.0"
edition = "2021"
description = "Minimal image viewer for Windows and Linux"
license = "CC0-1.0"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
rfd = "0.15.3"
tempfile = "3.19"
arboard = "3.4"
trash = "5.2"
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
moxcms = "0.8.1"
flate2 = "1.1"
chrono = "0.4"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 2
strip = true


[features]
installer = []

[[bin]]
name = "lume"
path = "src/main.rs"

[[bin]]
name = "lume-setup"
path = "src/bin/lume-setup.rs"
required-features = ["installer"]
